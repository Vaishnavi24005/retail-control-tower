name: Test control tower
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tower
          POSTGRES_USER: tower
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tower"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TOWER_DSN: postgresql://tower:test-only@127.0.0.1:5432/tower
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python tower.py demo
      - run: node --check demo/dashboard.js
      - run: pip install -r requirements.txt
      - run: python tower.py refresh --hour 2026-11-13T12:00:00+00:00
      - run: python tower.py refresh --hour 2026-11-13T12:00:00+00:00
      - run: python tests/check_warehouse.py
